# The agent review. Runs after "checks" in the base repository's context, with secrets, so it
# NEVER checks out or runs pull-request code: it reads the checks artifact and fetches the PR diff
# and game.json as text through the API, runs scripts/review from the default branch, then posts
# one sticky comment, the labels and the degenhive/agent-review commit status.
name: review

on:
  workflow_run:
    workflows: [checks]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: write
  issues: write
  statuses: write

concurrency:
  group: review-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  review:
    name: review
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'cancelled' &&
      github.event.workflow_run.conclusion != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      REPO: ${{ github.repository }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
    steps:
      - name: Check out the review code (default branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Download the checks results
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: checks
          path: in
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch the pull request diff and game.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p in
          node scripts/review/fetch-pr.mjs --artifact in --head-sha "$HEAD_SHA" --repo "$REPO" --out pr

      - name: Review
        if: hashFiles('pr/skip') == ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REVIEW_MODEL: ${{ vars.REVIEW_MODEL }}
        run: |
          node scripts/review/review.mjs --diff pr/pr.diff --game-json pr/game.json \
            --checks in/checks.json --shots in/screenshots --out out/verdict.json

      - name: Post the comment, labels and status
        if: hashFiles('pr/skip') == ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("pr/pr.json", "utf8")).number)')
          node scripts/review/comment.mjs --checks in/checks.json --verdict out/verdict.json \
            --post --repo "$REPO" --pr "$PR" --head-sha "$HEAD_SHA" --run-url "$RUN_URL"
