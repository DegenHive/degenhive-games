<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Honey Stack</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="stage"></canvas>

  <div id="hud" hidden>
    <div id="score">0</div>
  </div>
  <div id="popup"></div>
  <div id="badge" data-mode="local">Local test</div>
  <div id="toast" hidden></div>

  <section id="title" class="screen">
    <h1>Honey Stack</h1>
    <p>Drop the slab when it lines up.</p>
    <p>Anything hanging over is cut off.</p>
    <p class="best">Best <b id="best-title">0</b></p>
    <p class="cta">Tap or press Space to start</p>
    <p class="hint">Tap, click or press Space to drop</p>
  </section>

  <section id="over" class="screen" hidden>
    <h2>Tower down</h2>
    <p class="big" id="final">0</p>
    <p class="best">Best <b id="best-over">0</b> <span id="new-best" hidden>New best</span></p>
    <p class="stats" id="stats"></p>
    <p class="note" id="note"></p>
    <p class="cta">Tap or press Space to stack again</p>
  </section>

  <section id="paused" class="screen" hidden>
    <h2>Paused</h2>
  </section>

  <script type="module" src="game.js"></script>
</body>
</html>
